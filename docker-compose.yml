# PostgreSQL (данные проекта + метабаза Airflow) и Airflow 3.3.2 с LocalExecutor.
# Значения - только из .env (см. .env.example). Запуск: docker compose up -d
name: mos-data-pipeline

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: mos-airflow:3.3.2
  user: "${AIRFLOW_UID:?задайте AIRFLOW_UID в .env (id -u)}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?задайте AIRFLOW_DB_PASSWORD}@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?задайте AIRFLOW_FERNET_KEY}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?задайте AIRFLOW_SECRET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?задайте AIRFLOW_JWT_SECRET}
    AIRFLOW__API__WORKERS: "1"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./logs/airflow:/opt/airflow/logs
  depends_on: &airflow-depends-on
    postgres:
      condition: service_healthy
    airflow-db-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16.15-alpine
    container_name: mos-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?задайте POSTGRES_DB в .env}
      POSTGRES_USER: ${POSTGRES_USER:?задайте POSTGRES_USER в .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    # внутри лимита 1g: буферы и память на сортировки (перцентили, окна по ~1 млн строк)
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "work_mem=32MB", "-c", "maintenance_work_mem=128MB"]
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"  # только localhost
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 1g
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # База и пользователь airflow в том же Postgres. initdb-скрипты выполняются только на пустом томе,
  # поэтому отдельный идемпотентный шаг: создаёт, если нет, и синхронизирует пароль.
  airflow-db-init:
    image: postgres:16.15-alpine
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?задайте AIRFLOW_DB_PASSWORD}
    entrypoint: ["sh", "-ec"]
    command:
      - |
        psql -v ON_ERROR_STOP=1 -v pw="$$AIRFLOW_DB_PASSWORD" -v project_db="$$PGDATABASE" <<'SQL'
        SELECT format('CREATE ROLE airflow LOGIN PASSWORD %L', :'pw')
        WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'airflow') \gexec
        ALTER ROLE airflow PASSWORD :'pw';
        SELECT 'CREATE DATABASE airflow OWNER airflow'
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'airflow') \gexec
        SELECT format('REVOKE CONNECT ON DATABASE %I FROM PUBLIC', :'project_db') \gexec
        SQL
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 128m
    restart: "no"

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command: ["-c", "/entrypoint airflow version"]
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:?задайте AIRFLOW_ADMIN_USER}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?задайте AIRFLOW_ADMIN_PASSWORD}
    mem_limit: 1g
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"  # только localhost
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully
    mem_limit: 1g
    restart: unless-stopped

  # LocalExecutor выполняет задачи в этом контейнере: здесь venv проекта, данные и ключ API
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    environment:
      <<: *airflow-env
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SPARK_DRIVER_MEMORY: 2g
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./logs/airflow:/opt/airflow/logs
      - ./src:/opt/project/src:ro
      - ./sql:/opt/project/sql:ro
      - ./tests:/opt/project/tests:ro
      - ./pyproject.toml:/opt/project/pyproject.toml:ro
      - ./data:/opt/project/data
      - ./.spark-tmp:/opt/project/.spark-tmp  # spark.local.dir и кеш JDBC-драйвера
    secrets:
      - mos_api_key  # файл /run/secrets/mos_api_key; читают только задачи, обращающиеся к API
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully
    mem_limit: 3584m
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully
    mem_limit: 768m
    restart: unless-stopped

secrets:
  mos_api_key:
    environment: MOS_API_KEY

volumes:
  pgdata:
